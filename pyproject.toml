[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexhdl"
version = "0.1.0"
description = "A Python-based Hardware Description Language that compiles to SystemVerilog via CIRCT"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Yassine", email = "yassinz.you@gmail.com" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators",
    "Topic :: System :: Hardware",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "circt",
    "llvmlite",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
homepage = "https://github.com/yassinz/nexhdl"
repository = "https://github.com/yassinz/nexhdl"
bug_tracker = "https://github.com/yassinz/nexhdl/issues"
